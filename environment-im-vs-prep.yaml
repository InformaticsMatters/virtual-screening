---
# A development environment mirroring the vs-prep image.
#
#   conda env create -f environment-im-vs-prep.yaml
#
# This is a convenience for working on the code locally. It is NOT what builds
# the image - Dockerfile-prep is - so treat that as authoritative and keep
# this in step with it.
name: im-vs-prep
channels:
- conda-forge
dependencies:
- python == 3.12*
- pip
- rdkit == 2026.3.6
- openbabel == 3.1.1
- pytest
- pip:
  - scikit-learn==1.9.1
  - pdb2pqr==3.7.1
  - im-standardize-molecule==0.1.0
  - im-data-manager-job-utilities>=1.4.0
  - im-rdkit-utilities>=1.2.0
  - sigfig==1.3.19
